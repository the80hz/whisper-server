[[package]]
name = "whisper-server"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "av" },
    { name = "fastapi" },
    { name = "faster-whisper" },
    { name = "numpy" },
    { name = "pydantic-settings" },
    { name = "python-multipart" },
    { name = "uvicorn", extra = ["standard"] },
]

[package.optional-dependencies]
gigaam = [
    { name = "gigaam" },
    { name = "silero-vad" },
    { name = "torch" },
]
gpu = [
    { name = "nvidia-cublas-cu12", marker = "sys_platform == 'linux'" },
    { name = "nvidia-cudnn-cu12", marker = "sys_platform == 'linux'" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "av", specifier = ">=16.0.1" },
    { name = "fastapi", specifier = ">=0.115.0" },
    { name = "faster-whisper", specifier = ">=1.0.0" },
    { name = "gigaam", marker = "extra == 'gigaam'", git = "https://github.com/salute-developers/GigaAM?rev=7447938d791c4f3e643386ee22c33777004293a5" },
    { name = "numpy", specifier = ">=2.3.5" },
    { name = "nvidia-cublas-cu12", marker = "sys_platform == 'linux' and extra == 'gpu'", specifier = ">=12.4.0" },
    { name = "nvidia-cudnn-cu12", marker = "sys_platform == 'linux' and extra == 'gpu'", specifier = ">=9.1.0" },
    { name = "pydantic-settings", specifier = ">=2.6.0" },
    { name = "python-multipart", specifier = ">=0.0.6" },
    { name = "silero-vad", marker = "extra == 'gigaam'", specifier = ">=6.2.3" },
    { name = "torch", marker = "extra == 'gigaam'", specifier = ">=2.6" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.30.0" },
]
provides-extras = ["gpu", "gigaam"]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=8.3.4" },
    { name = "ruff", specifier = ">=0.8.2" },
]
