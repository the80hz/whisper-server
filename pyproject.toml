[project]
name = "whisper-server"
version = "0.1.0"
description = "FastAPI wrapper around faster-whisper with Docker and uv tooling"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "the80hz", email = "dnl.vlgv@mail.ru" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "faster-whisper>=1.0.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.6",
    "av>=16.0.1",
    "numpy>=2.3.5",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cudnn-cu12>=9.1.0; sys_platform == 'linux'",
    "nvidia-cublas-cu12>=12.4.0; sys_platform == 'linux'",
]

# GigaAM-v3 as a second engine (ENGINE=gigaam). v3 with word timestamps is not on PyPI, so
# the package comes from a pinned commit; it brings torch with its own CUDA libraries.
gigaam = [
    "gigaam",
    "torch>=2.6",
    "silero-vad>=6.2.3",
]

[project.urls]
Homepage = "https://github.com/the80hz/whisper-server"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "ruff>=0.8.2",
  "pytest>=8.3.4"
]

[tool.ruff]
line-length = 120

[tool.uv]
# torch ships its own CUDA libraries; the ones CTranslate2 needs are a separate set.
conflicts = [[{ extra = "gpu" }, { extra = "gigaam" }]]

[tool.uv.sources]
gigaam = { git = "https://github.com/salute-developers/GigaAM", rev = "7447938d791c4f3e643386ee22c33777004293a5" }
